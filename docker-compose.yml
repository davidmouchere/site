services:
  web:
    image: nginx:alpine
    container_name: web_app
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - web

server {
    listen 80;
    server_name testsiteem.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name testsiteem.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/testsiteem.duckdns.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testsiteem.duckdns.org-0001/privkey.pem;

    # Recommandations de sécurité SSL / TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # ==========================================
    # SUITES DE CHIFFREMENT (GCM / ChaCha20 uniquement)
    # ==========================================
    # Exclusion stricte de toutes les suites CBC (WEAK) et RC4/3DES
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    ssl_prefer_server_ciphers on;

    # Masquer la version exacte de Nginx dans le header Server
    server_tokens off;

    # --- EN-TÊTES DE SÉCURITÉ REQUIS ---

    # 1. Strict-Transport-Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. X-Frame-Options (Protection Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 3. X-Content-Type-Options (Protection MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Permissions-Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy (CSP) renforcée
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:;" always;

    location / {
        proxy_pass http://web_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

